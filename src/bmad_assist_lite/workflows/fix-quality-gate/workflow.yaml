name: fix-quality-gate
description: Fix quality gate failures

input_file_patterns:
  story_file:
    sharded: "{project-root}/**/story-{epic_num}.{story_num}.md"
    pattern: "{project-root}/**/{epic_num}-{story_num}-*.md"
    strategy: FULL_LOAD
    required: true

variables:
  - epic_num
  - story_num
