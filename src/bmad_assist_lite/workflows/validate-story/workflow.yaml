name: validate-story
description: "Independent quality validation of story context. Competes against the original create-story LLM to find mistakes, omissions, and disasters."
instructions: instructions.xml

input_file_patterns:
  story_file:
    sharded: "{project-root}/**/story-{epic_num}.{story_num}.md"
    pattern: "{project-root}/**/{epic_num}-{story_num}-*.md"
    strategy: FULL_LOAD
    required: true
  epic_file:
    sharded: "{project-root}/**/epic-{epic_num}.md"
    pattern: "{project-root}/**/epic-{epic_num}-*.md"
    strategy: FULL_LOAD
    required: false
  architecture_file:
    pattern: "{project-root}/**/architecture*.md"
    strategy: FULL_LOAD
    required: false
  prd_file:
    pattern: "{planning_artifacts}/*prd*.md"
    strategy: SELECTIVE_LOAD
    required: false
  project_context:
    pattern: "{project-root}/**/project-context.md"
    strategy: SELECTIVE_LOAD
    required: false

variables:
  mission: "Validate story quality for Epic {epic_num} Story {story_num}"
