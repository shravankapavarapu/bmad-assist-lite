name: code-review
description: "Perform an ADVERSARIAL Senior Developer code review that finds 3-10 specific problems in every story. Challenges everything: code quality, test coverage, architecture compliance, security, performance. NEVER accepts 'looks good' - must find minimum issues."
instructions: instructions.xml
checklist: checklist.md

input_file_patterns:
  story_file:
    sharded: "{project-root}/**/story-{epic_num}.{story_num}.md"
    pattern: "{project-root}/**/{epic_num}-{story_num}-*.md"
    strategy: FULL_LOAD
    required: true
  project_context:
    pattern: "{project-root}/**/project-context.md"
    strategy: SELECTIVE_LOAD
    required: false
  prd_file:
    pattern: "{planning_artifacts}/*prd*.md"
    strategy: SELECTIVE_LOAD
    required: false
  architecture_file:
    pattern: "{project-root}/**/architecture*.md"
    strategy: FULL_LOAD
    required: false
  epic_file:
    sharded: "{project-root}/**/epic-{epic_num}.md"
    pattern: "{project-root}/**/epic-{epic_num}-*.md"
    strategy: SELECTIVE_LOAD
    required: false

variables:
  mission: "Adversarial code review for Epic {epic_num} Story {story_num}"
