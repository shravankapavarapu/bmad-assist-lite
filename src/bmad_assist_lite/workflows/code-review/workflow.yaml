name: code-review
description: "Perform an ADVERSARIAL Senior Developer code review that finds 3-10 specific problems in every story. Challenges everything: code quality, test coverage, architecture compliance, security, performance. NEVER accepts 'looks good' - must find minimum issues."
instructions: instructions.xml
checklist: checklist.md

input_file_patterns:
  story_file:
    pattern: "**/{epic_num}-{story_num}*.md"
    strategy: FULL_LOAD
  project_context:
    pattern: "**/project_context*.md"
    strategy: FULL_LOAD
  architecture_file:
    pattern: "**/architecture*.md"
    strategy: FULL_LOAD

variables:
  mission: "Adversarial code review for Epic {epic_num} Story {story_num}"
