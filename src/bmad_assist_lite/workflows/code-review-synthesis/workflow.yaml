name: code-review-synthesis
instructions: instructions.xml

input_file_patterns:
  story_file:
    sharded: "{project-root}/**/story-{epic_num}.{story_num}.md"
    pattern: "{project-root}/**/{epic_num}-{story_num}-*.md"
    strategy: FULL_LOAD
    required: true

variables:
  mission: "Synthesize code review findings for Epic {epic_num} Story {story_num}"
  report_dir: "{output_folder}/implementation-artifacts/code-reviews"
